<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 420" font-family="Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="930" height="420" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f5fbf"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c8641e"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555555"/></marker>
  </defs>
  <text x="30" y="34" font-size="17" font-weight="bold" fill="#111">Harvard organisation: separate instruction bus and data bus</text>
  <text x="30" y="56" fill="#555">Blue = instruction path, orange = data path. They never share a wire, so both are used in the same cycle.</text>

  <!-- blocks -->
  <g fill="#ffffff" stroke="#333" stroke-width="1.3">
    <rect x="30"  y="100" width="120" height="56" rx="8"/>
    <rect x="200" y="100" width="160" height="56" rx="8"/>
    <rect x="420" y="80"  width="180" height="100" rx="8"/>
    <rect x="700" y="80"  width="180" height="64" rx="8"/>
    <rect x="420" y="250" width="180" height="56" rx="8"/>
    <rect x="700" y="250" width="180" height="56" rx="8"/>
    <rect x="700" y="340" width="180" height="56" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#111">
    <text x="90"  y="125" font-weight="bold">PC</text><text x="90" y="143" font-size="11.5" fill="#555">8-bit counter</text>
    <text x="280" y="125" font-weight="bold">Instruction ROM</text><text x="280" y="143" font-size="11.5" fill="#555">256 x 32, read-only</text>
    <text x="510" y="115" font-weight="bold">Harvard controller</text><text x="510" y="135" font-size="11.5" fill="#555">decode, accumulator, done</text><text x="510" y="152" font-size="11.5" fill="#555">1 cycle per instruction</text>
    <text x="790" y="106" font-weight="bold">Data RAM</text><text x="790" y="124" font-size="11.5" fill="#555">offsets 0x00 - 0x6F</text><text x="790" y="139" font-size="11.5" fill="#555">sync write, comb. read</text>
    <text x="510" y="275" font-weight="bold">R/W control</text><text x="510" y="293" font-size="11.5" fill="#555">opcode -&gt; mem_rd, mem_wr</text>
    <text x="790" y="275" font-weight="bold">Address decoder</text><text x="790" y="293" font-size="11.5" fill="#555">data side only</text>
    <text x="790" y="365" font-weight="bold">OUT register</text><text x="790" y="383" font-size="11.5" fill="#555">offset 0x70, drives out</text>
  </g>

  <!-- instruction bus -->
  <g stroke="#1f5fbf" stroke-width="2.2" fill="none">
    <path d="M150 128H198" marker-end="url(#ab)"/>
    <path d="M360 128H418" marker-end="url(#ab)"/>
  </g>
  <g fill="#1f5fbf" font-size="11.5"><text x="152" y="120">i_addr</text><text x="364" y="120">i_data</text></g>

  <!-- data bus -->
  <g stroke="#c8641e" stroke-width="2.2" fill="none">
    <path d="M600 100H698" marker-end="url(#ao)"/>
    <path d="M700 128H602" marker-end="url(#ao)"/>
  </g>
  <g fill="#c8641e" font-size="11.5"><text x="608" y="92">d_addr, d_wdata</text><text x="612" y="145">d_rdata</text></g>

  <!-- control -->
  <g stroke="#555" stroke-width="1.3" fill="none">
    <path d="M510 180V248" marker-end="url(#ag)"/>
    <path d="M600 278H698" marker-end="url(#ag)"/>
    <path d="M790 250V146" marker-end="url(#ag)"/>
    <path d="M790 306V338" marker-end="url(#ag)"/>
    <path d="M420 165H90V158" marker-end="url(#ag)"/>
    <path d="M880 368H905" marker-end="url(#ag)"/>
  </g>
  <g fill="#555" font-size="11.5">
    <text x="516" y="220">op, active</text>
    <text x="612" y="270">mem_wr</text>
    <text x="796" y="200">ram_we</text>
    <text x="796" y="327">out_we</text>
    <text x="250" y="180">pc_en (stops on HALT)</text>
    <text x="884" y="360">out</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
