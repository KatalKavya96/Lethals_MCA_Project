<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="420" fill="#ffffff"/>
  <defs>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a3fb0"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555555"/></marker>
  </defs>
  <text x="30" y="34" font-size="17" font-weight="bold" fill="#111">Shared-memory baseline: one port for fetches and data accesses</text>
  <text x="30" y="56" fill="#555">Purple = the single bus. A LOAD, STORE or ADD needs it twice, so it takes a FETCH cycle and an EXEC cycle.</text>

  <g fill="#ffffff" stroke="#333" stroke-width="1.3">
    <rect x="30"  y="100" width="120" height="56" rx="8"/>
    <rect x="200" y="80"  width="220" height="100" rx="8"/>
    <rect x="540" y="80"  width="230" height="100" rx="8"/>
    <rect x="200" y="250" width="220" height="56" rx="8"/>
    <rect x="540" y="250" width="230" height="56" rx="8"/>
    <rect x="540" y="340" width="230" height="56" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#111">
    <text x="90"  y="125" font-weight="bold">PC</text><text x="90" y="143" font-size="11.5" fill="#555">8-bit counter</text>
    <text x="310" y="113" font-weight="bold">Shared controller</text><text x="310" y="133" font-size="11.5" fill="#555">FSM: FETCH -&gt; EXEC only if needed</text><text x="310" y="150" font-size="11.5" fill="#555">m_addr = PC  or  0x80 + offset</text><text x="310" y="167" font-size="11.5" fill="#555">IR, accumulator, done</text>
    <text x="655" y="113" font-weight="bold">Shared memory (one port)</text><text x="655" y="133" font-size="11.5" fill="#555">0x00 - 0x7F program</text><text x="655" y="150" font-size="11.5" fill="#555">0x80 - 0xEF data</text><text x="655" y="167" font-size="11.5" fill="#555">256 x 32</text>
    <text x="310" y="275" font-weight="bold">R/W control (used twice)</text><text x="310" y="293" font-size="11.5" fill="#555">needs EXEC?  /  mem_rd, mem_wr</text>
    <text x="655" y="275" font-weight="bold">Address decoder</text><text x="655" y="293" font-size="11.5" fill="#555">blocks data writes to 0x00 - 0x7F</text>
    <text x="655" y="365" font-weight="bold">OUT register</text><text x="655" y="383" font-size="11.5" fill="#555">0xF0, drives out</text>
  </g>

  <g stroke="#7a3fb0" stroke-width="2.2" fill="none">
    <path d="M420 110H538" marker-end="url(#ap)"/>
    <path d="M540 150H422" marker-end="url(#ap)"/>
  </g>
  <g fill="#7a3fb0" font-size="11.5"><text x="430" y="102">m_addr, m_wdata</text><text x="430" y="168">m_rdata: instruction</text><text x="430" y="182">or data</text></g>

  <g stroke="#555" stroke-width="1.3" fill="none">
    <path d="M150 128H198" marker-end="url(#ag)"/>
    <path d="M310 180V248" marker-end="url(#ag)"/>
    <path d="M420 278H538" marker-end="url(#ag)"/>
    <path d="M655 250V182" marker-end="url(#ag)"/>
    <path d="M655 306V338" marker-end="url(#ag)"/>
    <path d="M200 165H90V158" marker-end="url(#ag)"/>
    <path d="M770 368H800" marker-end="url(#ag)"/>
  </g>
  <g fill="#555" font-size="11.5">
    <text x="156" y="120">pc</text>
    <text x="316" y="220">opcode, state</text>
    <text x="440" y="270">mem_wr</text>
    <text x="661" y="220">ram_we</text>
    <text x="661" y="327">out_we</text>
    <text x="96" y="180">pc_en</text>
    <text x="804" y="372">out</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
